# Builds the website in site/ and deploys it to GitHub Pages at
# https://emzbtw.github.io/vidicon/. The site reads README.md,
# docs/screenshots/ and assets/, so a change to any of them redeploys it too.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'docs/screenshots/**'
      - 'assets/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The devShell's major version (flake.nix, pkgs.nodejs).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job can publish; the build job runs npm packages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
