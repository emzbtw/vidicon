# Builds the .deb, .rpm and a tarball for a release and attaches them to its
# GitHub Release. Runs on a pushed version tag; run it by hand to attach
# packages to an existing release (the tag must match Cargo.toml's version).
#
# The build runs in an Ubuntu 22.04 container, so the binary needs glibc 2.35
# or newer: Debian 12, Ubuntu 22.04, Fedora 36 and later. Before upload, each
# package is installed and launched on the systems the README names
# (packaging/test/install-test.sh); a failure on any of them stops the upload.
name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the packages to, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig1-dev curl ca-certificates git

      # The tag, not the branch a manual run starts from.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches Cargo.toml and flake.nix
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG" || { echo "Cargo.toml is $version, tag is $TAG"; exit 1; }
          flake=$(sed -n 's/^ *version = "\(.*\)";$/\1/p' flake.nix | head -1)
          test "$flake" = "$version" || { echo "flake.nix is $flake, Cargo.toml is $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Unformatted code once stayed in for weeks: each `cargo fmt` rewrote
      # it, and the hunk was dropped as unrelated.
      - name: Check formatting
        run: cargo fmt --check

      - name: Install packagers
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1

      - name: Build
        run: cargo build --locked --release --no-default-features

      # As a normal user: root writes to read-only files, which breaks the
      # tests that check the app refuses to.
      - name: Test
        run: |
          useradd -m tester
          chmod a+x "$HOME"
          chown -R tester . "$HOME/.cargo" "$HOME/.rustup"
          runuser -u tester -- env PATH="$PATH" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            cargo test --locked --release --no-default-features

      - name: Package
        run: |
          strip target/release/vidicon
          mkdir dist
          # Fixed names, so releases/latest/download links in the README
          # never change. The packages still carry their version.
          cargo deb --no-build --output dist/vidicon_amd64.deb
          cargo generate-rpm --output dist/vidicon.x86_64.rpm
          tarball=vidicon-$VERSION-x86_64-linux
          mkdir "$tarball"
          cp target/release/vidicon README.md LICENSE "$tarball/"
          cp assets/vidicon.desktop assets/vidicon.svg "$tarball/"
          tar -czf "dist/$tarball.tar.gz" "$tarball"
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/

  install-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      # The oldest supported release of each distribution, which the README
      # names, and its newest through the latest tag. Move the oldest up (and
      # the README with it) when it reaches end of life.
      matrix:
        include:
          - { image: 'debian:12', package: vidicon_amd64.deb }
          - { image: 'debian:latest', package: vidicon_amd64.deb }
          - { image: 'ubuntu:22.04', package: vidicon_amd64.deb }
          - { image: 'ubuntu:latest', package: vidicon_amd64.deb }
          - { image: 'fedora:43', package: vidicon.x86_64.rpm }
          - { image: 'fedora:latest', package: vidicon.x86_64.rpm }
    steps:
      # The workflow's own commit, not the tag: an older tag may predate the
      # test script.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist

      - name: Install and run ${{ matrix.package }}
        run: sh packaging/test/install-test.sh "$PWD/dist/${{ matrix.package }}"

  upload:
    needs: install-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A pushed tag may not have a release yet.
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null ||
            gh release create "$TAG" --verify-tag --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
