# Builds the .deb, .rpm and a tarball for a release and attaches them to its
# GitHub Release. Runs on a pushed version tag; run it by hand to attach
# packages to an existing release (the tag must match Cargo.toml's version).
#
# The build runs in an Ubuntu 22.04 container, so the binary needs glibc 2.35
# or newer: Debian 12, Ubuntu 22.04, Fedora 36 and later.
name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the packages to, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig1-dev curl ca-certificates git

      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG" || { echo "Cargo.toml is $version, tag is $TAG"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install packagers
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.0

      - name: Build
        run: cargo build --locked --release --no-default-features

      - name: Test
        run: cargo test --locked --release --no-default-features

      - name: Package
        run: |
          strip target/release/vidicon
          mkdir dist
          cargo deb --no-build --output dist/
          cargo generate-rpm --output dist/
          tarball=vidicon-$VERSION-x86_64-linux
          mkdir "$tarball"
          cp target/release/vidicon README.md LICENSE "$tarball/"
          cp assets/vidicon.desktop assets/vidicon.svg "$tarball/"
          tar -czf "dist/$tarball.tar.gz" "$tarball"
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/

  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
