[package]
name = "vidicon"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A fast, keyboard-driven IPTV player for Linux"
homepage = "https://github.com/emzbtw/vidicon"
repository = "https://github.com/emzbtw/vidicon"

[features]
default = ["devtools"]
# Snapshots (`--screenshot`, F12). The Nix package builds without it.
devtools = ["dep:png"]

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
base64 = "0.23"
bytes = "1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
libc = "0.2"
log = "0.4"
# xz guide feeds (M3U ticket 05): pure Rust, so packages gain no library.
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "optimization", "xz"] }
png = { version = "0.18", optional = true }
nucleo-matcher = "0.3"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
slint = { version = "1.18", features = ["unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "net", "io-util", "fs"] }
toml = "1"
toml_edit = "0.25"
unicode-normalization = "0.1"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
lzma-rust2 = { version = "0.23", default-features = false, features = ["encoder"] }
tempfile = "3"

# Dependencies (Slint, bundled SQLite) are unusably slow unoptimised; our own
# crate stays at opt-level 0 for fast rebuilds and debugging.
[profile.dev.package."*"]
opt-level = 3

# One cache key per font, so glyph hinting state is reused: vendor/README.md.
[patch.crates-io]
femtovg = { path = "vendor/femtovg" }

# The .deb and .rpm on GitHub Releases (.github/workflows/release.yml). Built
# with --no-default-features first, then packaged with --no-build. Besides
# what the binary links, winit and femtovg load the EGL/GL, Wayland, X11
# and xkbcommon libraries at runtime; mpv and ffmpeg run as programs.
[package.metadata.deb]
maintainer = "emz <307707176+emzbtw@users.noreply.github.com>"
section = "video"
depends = "$auto, libegl1, libgl1, libwayland-client0, libwayland-egl1, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6, mpv, ffmpeg, fonts-inter"
assets = [
  ["target/release/vidicon", "usr/bin/", "755"],
  ["assets/vidicon.desktop", "usr/share/applications/", "644"],
  ["assets/vidicon.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["contrib/noctalia/vidicon.toml", "usr/share/vidicon/noctalia/", "644"],
  ["README.md", "usr/share/doc/vidicon/", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/vidicon", dest = "/usr/bin/vidicon", mode = "755" },
  { source = "assets/vidicon.desktop", dest = "/usr/share/applications/vidicon.desktop", mode = "644" },
  { source = "assets/vidicon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/vidicon.svg", mode = "644" },
  { source = "contrib/noctalia/vidicon.toml", dest = "/usr/share/vidicon/noctalia/vidicon.toml", mode = "644" },
  { source = "README.md", dest = "/usr/share/doc/vidicon/README.md", mode = "644", doc = true },
  { source = "LICENSE", dest = "/usr/share/licenses/vidicon/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"libEGL.so.1()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"/usr/bin/mpv" = "*"
"/usr/bin/ffmpeg" = "*"
rsms-inter-fonts = "*"
