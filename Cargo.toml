[package]
name = "vidicon"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = ["devtools"]
# Snapshots (`--screenshot`, F12). The Nix package builds without it.
devtools = ["dep:png"]

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
base64 = "0.23"
bytes = "1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
libc = "0.2"
log = "0.4"
png = { version = "0.18", optional = true }
nucleo-matcher = "0.3"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
slint = { version = "1.18", features = ["unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "net", "io-util", "fs"] }
toml = "1"
toml_edit = "0.25"
unicode-normalization = "0.1"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"

# Dependencies (Slint, bundled SQLite) are unusably slow unoptimised; our own
# crate stays at opt-level 0 for fast rebuilds and debugging.
[profile.dev.package."*"]
opt-level = 3

# One cache key per font, so glyph hinting state is reused: vendor/README.md.
[patch.crates-io]
femtovg = { path = "vendor/femtovg" }
